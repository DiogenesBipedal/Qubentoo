# Qubes GUI daemon configuration
# /etc/qubes/guid.conf

[global]
# Allow clipboard sharing between qubes (set to 0 to disable)
clipboard_allowed = 1

# Minimum colour for window decorations
# Format: RRGGBB hex
border_color = 000000

# GUI daemon log path
log_path = /var/log/qubes/guid.log

[display]
# See /etc/conf.d/qubes-gui-daemon for DISPLAY/XAUTHORITY settings
