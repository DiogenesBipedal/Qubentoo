# Qubes GUI agent configuration — /etc/qubes/guid.conf (inside domU)

[global]
# Target domain that receives our windows (always dom0 in standard Qubes)
gui_domain = dom0

# Log level: 0=errors only  1=info  2=debug
log_level = 1

# Clipboard integration: 1=enabled  0=disabled
clipboard = 1

# Maximum frames per second for screen updates
max_fps = 60
